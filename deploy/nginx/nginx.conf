server {                                                                                                                                                                           
    listen 80 default_server;                                                                                                                                                      
    server_name 129.204.52.101;                                                                                                                                                     

    # HTTP → HTTPS 全量跳转（隐私安全基线）                                                                                                                                        
    return 301 https://$host$request_uri;                                                                                                                                                                    
}                                                                                                                                                                                  
                                                                                                                                                                                        
server {                                                                                                                                                                           
    listen 443 ssl http2;                                                                                                                                                           
    server_name 129.204.52.101;                                                                                                                                                     
                                                                                                                                                                                        
    ssl_certificate /etc/nginx/selfsigned.crt;                                                                                                                                     
    ssl_certificate_key /etc/nginx/selfsigned.key;      

    # 上传上限：须 >= 应用侧 multipart 限制（max-request-size 35MB，面试语音复盘音频场景）                                                                                         
    client_max_body_size 35m;                                                                                                                            
                                                                                                                                                                                        
    # ==================== 静态站点 ====================                                                                                                                           
                                                                                                                                                                                        
    # C 端用户前端（主站）                                                                                                                                                         
    location / {                                                                                                                                                                   
        root /opt/ida/frontend/dist;          # ← app 端 dist 路径                                                                                                                 
        index index.html;                                                                                                                                                          
        try_files $uri $uri/ /index.html;      # Vue Router history 模式                                                                                                           
    }                                                                                                                                                                              
                                                                                                                                                                                        
    # 管理后台前端，访问路径 /console/                                                                                                                                             
    location ^~ /console/ {                                                                                                                                                           
        alias /opt/ida/admin-frontend/dist/;   # ← admin 端 dist 路径，注意 alias 末尾带 /                                                                                         
        index index.html;                                                                                                                                                          
        try_files $uri $uri/ /console/index.html;    

            # 静态资源缓存                                                                                                                                                                 
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {                                                                                                          
            expires 30d;                                                                                                                                                               
            add_header Cache-Control "public, immutable";                                                                                                                              
        }                                                                                                                                
    }                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                       
    location /app/ {                                                                                                                                                               
        proxy_pass http://127.0.0.1:8088/api/v1/app/;                                                                                                                              
        proxy_set_header Host $host;                                                                                                                                               
        proxy_set_header X-Real-IP $remote_addr;                                                                                                                                   
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                                                                                                               
        proxy_set_header X-Forwarded-Proto $scheme;                                                                                                                                
        proxy_read_timeout 300s;                                                                                                                                                   
        proxy_send_timeout 300s;                                                                                                                                                   
        proxy_connect_timeout 10s;                                                                                                                                                 
    }                                                                                                                                                                              
                                                                                                                                                                                        
    location /plugin/ {                                                                                                                                                            
        proxy_pass http://127.0.0.1:8089/api/v1/plugin/;                                                                                                                           
        proxy_set_header Host $host;                                                                                                                                               
        proxy_set_header X-Real-IP $remote_addr;                                                                                                                                   
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                                                                                                               
        proxy_set_header X-Forwarded-Proto $scheme;                                                                                                                                
        proxy_read_timeout 300s;                                                                                                                                                   
        proxy_send_timeout 300s;                                                                                                                                                   
        proxy_connect_timeout 10s;                                                                                                                                                 
    }                                                                                                                                                                              
                                                                                                                                                                                        
    location /admin/ {                                                                                                                                                             
        proxy_pass http://127.0.0.1:8090/api/v1/admin/;                                                                                                                            
        proxy_set_header Host $host;                                                                                                                                               
        proxy_set_header X-Real-IP $remote_addr;                                                                                                                                   
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                                                                                                               
        proxy_set_header X-Forwarded-Proto $scheme;                                                                                                                                
        proxy_read_timeout 60s;                                                                                                                                                    
        proxy_connect_timeout 10s;                                                                                                                                                 
    }              

    location /app/downloads/ {
        alias /opt/ida/plugin-frontend/;
        autoindex off;
    }                                                                                                                                                                  
}