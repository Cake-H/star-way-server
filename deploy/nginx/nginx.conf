# ============================================================
# 智能投递助手 — HTTPS 终止 + 反向代理（隐私安全基线 1.4）
#
# 部署：
#   1. 把证书放到 deploy/nginx/certs/：server.crt（全链证书）与 server.key
#      - Let's Encrypt: certbot certonly --standalone -d your-domain.com
#      - 自签（仅测试）: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#          -keyout server.key -out server.crt -subj "/CN=your-domain.com"
#   2. 把下方 your-domain.com 替换为真实域名
#   3. docker compose up -d nginx
# ============================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 简历上传（PDF/DOCX）上限
    client_max_body_size 20m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # HTTP → HTTPS 全量跳转
    server {
        listen 80;
        server_name your-domain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name your-domain.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # 安全：抹掉客户端伪造的身份头，X-User-Id 只允许可信内部注入（且服务端默认已禁用）
        proxy_set_header X-User-Id "";

        # ---------- App 服务 ----------
        location /api/v1/app/ {
            proxy_pass http://ida-app-server:8088;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;   # 简历 AI 解析为长请求
        }

        # ---------- Plugin 服务 ----------
        location /api/v1/plugin/ {
            proxy_pass http://ida-plugin-server:8089;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # ---------- Admin 服务（管理后台） ----------
        location /api/v1/admin/ {
            proxy_pass http://ida-admin-server:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Swagger / actuator 不对外暴露
        location ~* ^/(v3/api-docs|swagger-ui|actuator) {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
