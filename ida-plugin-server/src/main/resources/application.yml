# ============================================================
# 公共配置 — 所有环境共享（框架、中间件行为、业务参数常量）
# 环境差异项请在 application-{dev|prod}.yml 中覆盖
# ============================================================

server:
  port: ${PLUGIN_SERVER_PORT:8089}

spring:
  application:
    name: ida-plugin-server
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: 'null'
      logic-delete-value: 'now()'

# -------------------- 接口文档 --------------------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-default-group: true
    default-group-name: plugin

# -------------------- IDA 公共业务配置 --------------------
ida:
  cors:
    allowed-origin-patterns:
      - "*"
    exposed-headers: []

  http:
    identity:
      user-id-header: X-User-Id
      request-id-header: X-Request-Id
      authorization-header: Authorization

  auth:
    session:
      token-ttl-seconds: 604800
      bearer-prefix: "Bearer "

  sms:
    code:
      length: 6
      ttl-seconds: 300
      resend-interval-seconds: 60

  crypto:
    bcrypt:
      strength: 10
    aes-field:
      enabled: false
      secret: ${IDA_AES_FIELD_SECRET:}
      salt-hex: ${IDA_AES_FIELD_SALT_HEX:}

  # LangChain4j — 大模型调用参数（各环境一致）
  langchain4j:
    env-api-key-name: ARK_API_KEY
    base-url: https://api.deepseek.com
    resume-parse:
      model: deepseek-v4-flash
      max-plain-text-chars: 80000
      temperature: 0.2
      read-timeout-ms: 300000
      response-format-json-object: true
    plugin-autofill:
      model: deepseek-v4-flash
      temperature: 0.15
      max-tokens: 16384
      read-timeout-ms: 300000
      response-format-json-object: true
    interview-summarize:
      model: deepseek-v4-pro
      temperature: 0.3
      max-tokens: 8192
      read-timeout-ms: 120000
      response-format-json-object: true
