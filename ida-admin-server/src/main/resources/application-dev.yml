# ============================================================
# 开发环境配置 — 本地开发使用
# 所有敏感信息都有本地默认值，方便开箱即用
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ida_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: ${IDA_REDIS_HOST:127.0.0.1}
      port: ${IDA_REDIS_PORT:6379}
      password: ${IDA_REDIS_PASSWORD:}
      database: ${IDA_ADMIN_REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

http:
  pool:
    max-total: 20
    connect-timeout: 5000
    read-timeout: 30000
    write-timeout: 30000
    keep-alive: 300000

ida:
  crypto:
    aes-field:
      # 仅本地开发的固定密钥（dev 库专用，切勿用于生产；生产走 IDA_AES_FIELD_SECRET/IDA_AES_FIELD_SALT_HEX 环境变量）
      secret: dev-only-insecure-secret-0123456789
      salt-hex: 0123456789abcdef

  http:
    identity:
      # 仅本地联调允许 X-User-Id 直接指定用户；生产必须为 false（默认）
      user-id-header-enabled: true

  server:
    access-host: ${IDA_ACCESS_HOST:127.0.0.1}
    api-v1-prefix: /api/v1/admin

  # 用户反馈附件预签名 URL 需要 OSS（反馈本身在 APP 端上传，后台只读）
  aliyun:
    oss:
      enabled: true
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      key-prefix: app/resume/
      public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}

logging:
  level:
    com.smartapply: debug
