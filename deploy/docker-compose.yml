# ============================================================
# 生产环境 Docker Compose 编排文件
# 放在服务器 ${DEPLOY_DIR:-/opt/ida}/ 目录下
#
# 使用方式：
#   1. 复制 .env.example 为 .env，填入真实值
#   2. docker compose up -d
#   3. docker compose ps      # 查看状态
#   4. docker compose logs -f # 查看日志
# ============================================================

services:
  # ==================== App 服务 ====================
  ida-app-server:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest
    container_name: ida-app-server
    restart: unless-stopped
    ports:
      - "${APP_SERVER_PORT:-8088}:8088"
    environment:
      # --- Spring ---
      SPRING_PROFILES_ACTIVE: prod
      APP_SERVER_PORT: "8088"
      # --- 数据库 ---
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # --- Redis ---
      IDA_REDIS_HOST: ${IDA_REDIS_HOST}
      IDA_REDIS_PORT: "${IDA_REDIS_PORT:-6379}"
      IDA_REDIS_PASSWORD: ${IDA_REDIS_PASSWORD}
      IDA_REDIS_DB: "${IDA_REDIS_DB:-0}"
      # --- 访问域名/IP ---
      IDA_ACCESS_HOST: ${IDA_ACCESS_HOST}
      # --- 阿里云 ---
      ALIBABA_ACCESS_KEY_ID: ${ALIBABA_ACCESS_KEY_ID}
      ALIBABA_ACCESS_KEY_SECRET: ${ALIBABA_ACCESS_KEY_SECRET}
      # 短信
      ALIBABA_SMS_ENABLED: ${ALIBABA_SMS_ENABLED:-false}
      ALIBABA_SMS_SIGN_NAME: ${ALIBABA_SMS_SIGN_NAME}
      ALIBABA_SMS_TEMPLATE_CODE: ${ALIBABA_SMS_TEMPLATE_CODE}
      ALIBABA_DYPNS_SCHEME_NAME: ${ALIBABA_DYPNS_SCHEME_NAME:-}
      # OSS
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL}
      # 语音识别
      ALIYUN_NLS_APP_KEY: ${ALIYUN_NLS_APP_KEY}
      # --- 大模型 ---
      ARK_API_KEY_DEEPSEEK: ${ARK_API_KEY_DEEPSEEK}
      # --- AES 字段加密（隐私基线，必填） ---
      IDA_AES_FIELD_SECRET: ${IDA_AES_FIELD_SECRET}
      IDA_AES_FIELD_SALT_HEX: ${IDA_AES_FIELD_SALT_HEX}
    networks:
      - ida-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ==================== Plugin 服务 ====================
  ida-plugin-server:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest
    container_name: ida-plugin-server
    restart: unless-stopped
    ports:
      - "${PLUGIN_SERVER_PORT:-8089}:8089"
    environment:
      # --- Spring ---
      SPRING_PROFILES_ACTIVE: prod
      PLUGIN_SERVER_PORT: "8089"
      # --- 数据库 ---
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # --- Redis ---
      IDA_REDIS_HOST: ${IDA_REDIS_HOST}
      IDA_REDIS_PORT: "${IDA_REDIS_PORT:-6379}"
      IDA_REDIS_PASSWORD: ${IDA_REDIS_PASSWORD}
      IDA_PLUGIN_REDIS_DB: "${IDA_PLUGIN_REDIS_DB:-1}"
      # --- 访问域名/IP ---
      IDA_ACCESS_HOST: ${IDA_ACCESS_HOST}
      # --- 阿里云 ---
      ALIBABA_ACCESS_KEY_ID: ${ALIBABA_ACCESS_KEY_ID}
      ALIBABA_ACCESS_KEY_SECRET: ${ALIBABA_ACCESS_KEY_SECRET}
      # 短信
      ALIBABA_SMS_ENABLED: ${ALIBABA_SMS_ENABLED:-false}
      ALIBABA_SMS_SIGN_NAME: ${ALIBABA_SMS_SIGN_NAME}
      ALIBABA_SMS_TEMPLATE_CODE: ${ALIBABA_SMS_TEMPLATE_CODE}
      ALIBABA_DYPNS_SCHEME_NAME: ${ALIBABA_DYPNS_SCHEME_NAME:-}
      # OSS
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL}
      # --- 大模型 ---
      ARK_API_KEY: ${ARK_API_KEY}
      # --- AES 字段加密（隐私基线，必填） ---
      IDA_AES_FIELD_SECRET: ${IDA_AES_FIELD_SECRET}
      IDA_AES_FIELD_SALT_HEX: ${IDA_AES_FIELD_SALT_HEX}
    networks:
      - ida-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ==================== Nginx（HTTPS 终止 + 反代，隐私安全基线） ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: ida-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - ida-app-server
      - ida-plugin-server
    networks:
      - ida-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ==================== MySQL（可选，已有外部数据库可注释掉） ====================
  mysql:
    image: mysql:8.0
    container_name: ida-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 创建一个专用用户（可选）
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d  # 初始化 SQL 脚本
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - ida-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # 如果已有外部 MySQL，整个 mysql 服务可以注释掉
    profiles:
      - full

  # ==================== Redis（可选，已有外部 Redis 可注释掉） ====================
  redis:
    image: redis:7-alpine
    container_name: ida-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${IDA_REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - ida-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${IDA_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # 如果已有外部 Redis，整个 redis 服务可以注释掉
    profiles:
      - full

# ==================== 网络 & 数据卷 ====================
networks:
  ida-network:
    driver: bridge
    name: ida-network

volumes:
  mysql-data:
    name: ida-mysql-data
  redis-data:
    name: ida-redis-data
