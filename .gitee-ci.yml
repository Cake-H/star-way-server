# ============================================================
# Gitee Go CI/CD 自动化部署流水线
# 触发条件: push 到 main 分支 → 自动构建 & 部署
#           push 到其他分支 → 仅构建验证
#
# 需要的 CI 密钥（在 Gitee 仓库 → 设置 → CI/CD → 变量 中配置）:
#   ACR_REGISTRY       — 阿里云 ACR 仓库地址，如 registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE      — ACR 命名空间
#   ACR_USERNAME       — ACR 登录用户名（阿里云账号或 RAM 子账号）
#   ACR_PASSWORD       — ACR 登录密码
#   SSH_HOST           — 部署服务器 IP
#   SSH_PORT           — 部署服务器 SSH 端口（默认 22）
#   SSH_USER           — SSH 登录用户
#   SSH_PRIVATE_KEY    — SSH 私钥（用于免密登录）
#   DEPLOY_DIR         — 服务器上部署目录，如 /opt/ida
#   MYSQL_PASSWORD     — 生产数据库密码
#   IDA_REDIS_PASSWORD — 生产 Redis 密码
#   ALIBABA_ACCESS_KEY_ID / ALIBABA_ACCESS_KEY_SECRET — 阿里云 AK（SMS/OSS/NLS 共用）
#   ALIBABA_SMS_ENABLED         — 短信服务开关（true/false，默认 false）
#   ALIBABA_SMS_SIGN_NAME       — 短信签名
#   ALIBABA_SMS_TEMPLATE_CODE   — 短信模板 Code
#   ALIBABA_DYPNS_SCHEME_NAME   — 号码认证 Scheme（可选）
#   ALIYUN_OSS_ENDPOINT        — OSS Endpoint（如 oss-cn-hangzhou.aliyuncs.com）
#   ALIYUN_OSS_BUCKET          — OSS Bucket 名称
#   ALIYUN_OSS_PUBLIC_BASE_URL — OSS 公开访问 URL 前缀
#   ALIYUN_NLS_APP_KEY         — 语音识别 AppKey
#   ARK_API_KEY_DEEPSEEK / ARK_API_KEY / OPENAI_API_KEY — 大模型 API Key
# ============================================================

version: '1.0'

name: ida-cicd

# -------------------- 触发条件 --------------------
triggers:
  push:
    branches:
      include:
        - main        # main 分支 → 构建+推送+部署
        - dev         # dev 分支 → 仅构建验证
      exclude:
        - '*-wip'
        - '*-tmp'
  pull_request:
    branches:
      include:
        - main

# -------------------- 全局环境变量 --------------------
variables:
  # 镜像标签：优先用 commit tag，否则用 commit sha 前7位
  IMAGE_TAG: ${GITEE_TAG_NAME:-${GITEE_COMMIT_SHORT}}
  # 两个服务的镜像全名（由 ACR 变量拼接）
  APP_IMAGE: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:${IMAGE_TAG}
  PLUGIN_IMAGE: ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:${IMAGE_TAG}

# ==================== 流水线阶段 ====================
stages:
  # ---------- Stage 1: 编译 ----------
  - name: build
    displayName: Maven 编译打包
    jobs:
      - name: maven-build
        displayName: 编译 & 单元测试
        steps:
          - name: cache
            displayName: 恢复 Maven 缓存
            type: cache:restore
            options:
              keys:
                - maven-{{ checksum "pom.xml" }}
                - maven-
              paths:
                - .m2/repository

          - name: build
            displayName: Maven package
            image: maven:3.9-eclipse-temurin-17-alpine
            commands:
              - mvn package -DskipTests=false -B -q
            timeout: 600   # 10 分钟

          - name: save-cache
            displayName: 保存 Maven 缓存
            type: cache:save
            options:
              key: maven-{{ checksum "pom.xml" }}
              paths:
                - .m2/repository

  # ---------- Stage 2: 构建 & 推送 Docker 镜像 ----------
  - name: docker
    displayName: Docker 镜像构建 & 推送
    needs: build
    # 仅 main 分支执行推送，其他分支只构建不推送
    jobs:
      - name: docker-app
        displayName: ida-app-server 镜像
        steps:
          - name: login
            displayName: 登录 ACR
            image: docker:24-cli
            commands:
              - echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"

          - name: build-image
            displayName: 构建镜像
            image: docker:24-cli
            commands:
              - docker build --build-arg MODULE=ida-app-server -t ${APP_IMAGE} -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest .
            timeout: 900   # 15 分钟

          - name: push-image
            displayName: 推送镜像
            image: docker:24-cli
            commands:
              - docker push ${APP_IMAGE}
              - docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest

      - name: docker-plugin
        displayName: ida-plugin-server 镜像
        steps:
          - name: login
            displayName: 登录 ACR
            image: docker:24-cli
            commands:
              - echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"

          - name: build-image
            displayName: 构建镜像
            image: docker:24-cli
            commands:
              - docker build --build-arg MODULE=ida-plugin-server -t ${PLUGIN_IMAGE} -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest .
            timeout: 900

          - name: push-image
            displayName: 推送镜像
            image: docker:24-cli
            commands:
              - docker push ${PLUGIN_IMAGE}
              - docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest

  # ---------- Stage 3: 部署 ----------
  - name: deploy
    displayName: SSH 远程部署
    needs: docker
    # 仅 main 分支自动部署
    jobs:
      - name: deploy-server
        displayName: 部署到生产服务器
        steps:
          - name: deploy
            displayName: SSH 连接 → 拉取镜像 → 重启服务
            image: alpine:3.20
            commands: |
              # 安装 SSH 客户端 & 配置免密登录
              apk add --no-cache openssh-client

              # 写入 SSH 私钥（通过 CI 变量注入）
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              ssh-keyscan -p ${SSH_PORT:-22} ${SSH_HOST} >> ~/.ssh/known_hosts

              # ========== 远程执行部署（不引号=CI 变量展开后发送到远端） ==========
              ssh -p ${SSH_PORT:-22} ${SSH_USER}@${SSH_HOST} << DEPLOY_EOF
                set -e

                # 登录 ACR
                echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"

                # 切换到部署目录
                cd ${DEPLOY_DIR:-/opt/ida}

                # 拉取最新镜像
                docker pull ${APP_IMAGE}
                docker pull ${PLUGIN_IMAGE}

                # 更新镜像标签为 latest（docker-compose 引用 latest）
                docker tag ${APP_IMAGE} ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest
                docker tag ${PLUGIN_IMAGE} ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest

                # 写入 .env 文件（生产环境变量）
                cat > .env << ENVEOF
                # === 自动生成，请勿手动修改 ===
                SPRING_PROFILES_ACTIVE=prod
                MYSQL_HOST=${MYSQL_HOST}
                MYSQL_PORT=${MYSQL_PORT:-3306}
                MYSQL_DATABASE=${MYSQL_DATABASE}
                MYSQL_USER=${MYSQL_USER}
                MYSQL_PASSWORD=${MYSQL_PASSWORD}
                IDA_REDIS_HOST=${IDA_REDIS_HOST}
                IDA_REDIS_PORT=${IDA_REDIS_PORT:-6379}
                IDA_REDIS_PASSWORD=${IDA_REDIS_PASSWORD}
                IDA_ACCESS_HOST=${IDA_ACCESS_HOST}
                ALIBABA_ACCESS_KEY_ID=${ALIBABA_ACCESS_KEY_ID}
                ALIBABA_ACCESS_KEY_SECRET=${ALIBABA_ACCESS_KEY_SECRET}
                ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT}
                ALIYUN_OSS_ACCESS_KEY_ID=${ALIBABA_ACCESS_KEY_ID}
                ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIBABA_ACCESS_KEY_SECRET}
                ALIYUN_OSS_BUCKET=${ALIYUN_OSS_BUCKET}
                ALIYUN_OSS_PUBLIC_BASE_URL=${ALIYUN_OSS_PUBLIC_BASE_URL}
                ALIBABA_SMS_ENABLED=${ALIBABA_SMS_ENABLED:-false}
                ALIBABA_SMS_SIGN_NAME=${ALIBABA_SMS_SIGN_NAME:-}
                ALIBABA_SMS_TEMPLATE_CODE=${ALIBABA_SMS_TEMPLATE_CODE:-}
                ALIBABA_DYPNS_SCHEME_NAME=${ALIBABA_DYPNS_SCHEME_NAME:-}
                ALIYUN_NLS_APP_KEY=${ALIYUN_NLS_APP_KEY}
                ARK_API_KEY_DEEPSEEK=${ARK_API_KEY_DEEPSEEK}
                ARK_API_KEY=${ARK_API_KEY}
                ENVEOF

                # 重启服务（零停机滚动更新）
                docker compose up -d --remove-orphans

                # 清理旧镜像（保留最近 3 个版本）
                docker image prune -af --filter "until=72h"

                echo "===== 部署完成 ====="
                docker compose ps
              DEPLOY_EOF
            timeout: 300   # 5 分钟

  # ---------- Stage 4: 通知 ----------
  - name: notify
    displayName: 构建摘要
    # 不论前面成功与否都输出摘要
    jobs:
      - name: result
        displayName: 输出构建结果
        steps:
          - name: summary
            image: alpine:3.20
            commands: |
              echo "============================================"
              echo "  构建分支: ${GITEE_BRANCH}"
              echo "  提交信息: ${GITEE_COMMIT_MESSAGE}"
              echo "  镜像标签: ${IMAGE_TAG}"
              echo "  App 镜像: ${APP_IMAGE}"
              echo "  Plugin 镜像: ${PLUGIN_IMAGE}"
              echo "============================================"
