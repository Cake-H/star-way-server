# 正式客户端进程 — 默认端口 8088（与插件进程分离部署）
server:
  port: ${APP_SERVER_PORT:8088}

spring:
  application:
    name: ida-app-server
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ida_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: ${IDA_REDIS_HOST:127.0.0.1}
      port: ${IDA_REDIS_PORT:6379}
      password: ${IDA_REDIS_PASSWORD:}
      database: ${IDA_REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

http:
  pool:
    max-total: 20
    connect-timeout: 5000
    read-timeout: 30000
    write-timeout: 30000
    keep-alive: 300000

ida:
  server:
    # 启动完成后控制台输出的访问主机；手机联调可设 IDA_ACCESS_HOST=本机局域网 IP
    access-host: ${IDA_ACCESS_HOST:127.0.0.1}
    api-v1-prefix: /api/v1/app

  cors:
    allowed-origin-patterns:
      - "*"
    exposed-headers: []

  http:
    identity:
      user-id-header: X-User-Id
      request-id-header: X-Request-Id
      authorization-header: Authorization

  aliyun:
    sms:
      enabled: false
      access-key-id: ${ALIBABA_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_ACCESS_KEY_SECRET:}
      sign-name: ${ALIBABA_SMS_SIGN_NAME:}
      template-code: ${ALIBABA_SMS_TEMPLATE_CODE:}
      scheme-name: ${ALIBABA_DYPNS_SCHEME_NAME:}
      endpoint: dypnsapi.aliyuncs.com
    oss:
      enabled: true
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      key-prefix: app/resume/
      public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
  sms:
    code:
      length: 6
      ttl-seconds: 300
      resend-interval-seconds: 60
  auth:
    session:
      token-ttl-seconds: 604800
      bearer-prefix: "Bearer "

  volcengine-ark:
    env-api-key: ARK_API_KEY_DEEPSEEK
    # base-url: https://ark.cn-beijing.volces.com/api/v3
    base-url: https://api.deepseek.com
    resume-parse:
      # model: doubao-seed-2-0-lite-260215
      model: deepseek-v4-flash
      max-plain-text-chars: 80000
      temperature: 0.2
      thinking-type: disabled
      read-timeout-ms: 300000
    plugin-autofill:
      model: ""
      thinking-type: disabled
#      reasoning-effort: minimal
      max-tokens: 16384
      response-format-json-object: true
      temperature: 0.15
    interview-summarize:
      model: deepseek-v4-pro
      temperature: 0.3
      thinking-type: disabled
      max-tokens: 8192
      response-format-json-object: true
      read-timeout-ms: 120000

  speech-to-text:
    enabled: true
    # aliyun：智能语音交互实时识别（默认）；whisper：OpenAI 兼容听写
    provider: aliyun
    min-transcript-chars: 10
    aliyun:
      app-key: ${ALIYUN_NLS_APP_KEY:UOW65lvdlNg9TN1E}
      access-key-id: ${ALIBABA_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_ACCESS_KEY_SECRET:}
      region-id: cn-shanghai
      sample-rate: 16000
      read-timeout-ms: 300000
      send-chunk-bytes: 3200
    whisper:
      env-api-key: OPENAI_API_KEY
      base-url: https://api.openai.com/v1
      model: whisper-1
      read-timeout-ms: 120000

  crypto:
    bcrypt:
      strength: 10
    aes-field:
      enabled: false
      secret: ${IDA_AES_FIELD_SECRET:}
      salt-hex: ${IDA_AES_FIELD_SALT_HEX:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: 'null'
      logic-delete-value: 'now()'

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
