# ============================================================
# Gitee Go CI/CD 自动化部署流水线
# 文档: https://gitee.com/help/articles/4254
# ============================================================

name: ida-cicd

# -------------------- 触发条件 --------------------
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

# -------------------- 环境变量 --------------------
env:
  IMAGE_TAG: ${{ gitee.sha_short }}
  APP_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ida-app-server:${{ env.IMAGE_TAG }}
  PLUGIN_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ida-plugin-server:${{ env.IMAGE_TAG }}

# ==================== 流水线 ====================
stages:
  # ==================== Stage 1: Docker 镜像构建 & 推送 ====================
  - stage:
      name: docker-build
      displayName: Docker 镜像构建 & 推送
      jobs:
        - job:
            name: build-app
            displayName: 构建 ida-app-server 镜像
            runs-on:
              - docker
            steps:
              - name: login-acr
                displayName: 登录 ACR
                run: |
                  echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"

              - name: build-image
                displayName: 构建镜像
                run: |
                  docker build --build-arg MODULE=ida-app-server -t ${APP_IMAGE} -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest .
                timeout: 900

              - name: push-image
                displayName: 推送镜像
                run: |
                  docker push ${APP_IMAGE}
                  docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest

        - job:
            name: build-plugin
            displayName: 构建 ida-plugin-server 镜像
            runs-on:
              - docker
            steps:
              - name: login-acr
                displayName: 登录 ACR
                run: |
                  echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"

              - name: build-image
                displayName: 构建镜像
                run: |
                  docker build --build-arg MODULE=ida-plugin-server -t ${PLUGIN_IMAGE} -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest .
                timeout: 900

              - name: push-image
                displayName: 推送镜像
                run: |
                  docker push ${PLUGIN_IMAGE}
                  docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest

  # ==================== Stage 2: SSH 远程部署 ====================
  - stage:
      name: deploy
      displayName: SSH 远程部署
      needs: docker-build
      jobs:
        - job:
            name: deploy-server
            displayName: 部署到生产服务器
            runs-on:
              - linux
            steps:
              - name: setup-ssh
                displayName: 配置 SSH
                run: |
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -p ${SSH_PORT:-22} ${SSH_HOST} >> ~/.ssh/known_hosts

              - name: deploy
                displayName: 远程部署
                run: |
                  ssh -p ${SSH_PORT:-22} ${SSH_USER}@${SSH_HOST} << 'DEPLOY_SCRIPT'
                  set -e

                  # 登录 ACR
                  echo "${ACR_PASSWORD}" | docker login -u "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"

                  # 切换目录
                  cd ${DEPLOY_DIR:-/opt/ida}

                  # 拉取最新镜像
                  docker pull ${APP_IMAGE}
                  docker pull ${PLUGIN_IMAGE}

                  # 更新 latest 标签
                  docker tag ${APP_IMAGE} ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-app-server:latest
                  docker tag ${PLUGIN_IMAGE} ${ACR_REGISTRY}/${ACR_NAMESPACE}/ida-plugin-server:latest

                  # 写入 .env 文件
                  cat > .env << 'ENV_FILE'
                  SPRING_PROFILES_ACTIVE=prod
                  MYSQL_HOST=${MYSQL_HOST}
                  MYSQL_PORT=${MYSQL_PORT:-3306}
                  MYSQL_DATABASE=${MYSQL_DATABASE}
                  MYSQL_USER=${MYSQL_USER}
                  MYSQL_PASSWORD=${MYSQL_PASSWORD}
                  IDA_REDIS_HOST=${IDA_REDIS_HOST}
                  IDA_REDIS_PORT=${IDA_REDIS_PORT:-6379}
                  IDA_REDIS_PASSWORD=${IDA_REDIS_PASSWORD}
                  IDA_ACCESS_HOST=${IDA_ACCESS_HOST}
                  ALIBABA_ACCESS_KEY_ID=${ALIBABA_ACCESS_KEY_ID}
                  ALIBABA_ACCESS_KEY_SECRET=${ALIBABA_ACCESS_KEY_SECRET}
                  ALIBABA_SMS_ENABLED=${ALIBABA_SMS_ENABLED:-false}
                  ALIBABA_SMS_SIGN_NAME=${ALIBABA_SMS_SIGN_NAME:-}
                  ALIBABA_SMS_TEMPLATE_CODE=${ALIBABA_SMS_TEMPLATE_CODE:-}
                  ALIBABA_DYPNS_SCHEME_NAME=${ALIBABA_DYPNS_SCHEME_NAME:-}
                  ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT}
                  ALIYUN_OSS_ACCESS_KEY_ID=${ALIBABA_ACCESS_KEY_ID}
                  ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIBABA_ACCESS_KEY_SECRET}
                  ALIYUN_OSS_BUCKET=${ALIYUN_OSS_BUCKET}
                  ALIYUN_OSS_PUBLIC_BASE_URL=${ALIYUN_OSS_PUBLIC_BASE_URL}
                  ALIYUN_NLS_APP_KEY=${ALIYUN_NLS_APP_KEY}
                  ARK_API_KEY_DEEPSEEK=${ARK_API_KEY_DEEPSEEK}
                  ARK_API_KEY=${ARK_API_KEY}
                  ENV_FILE

                  # 重启服务
                  docker compose up -d --remove-orphans

                  # 清理旧镜像
                  docker image prune -af --filter "until=72h"

                  echo "===== 部署完成 ====="
                  docker compose ps
                  DEPLOY_SCRIPT
                timeout: 300
